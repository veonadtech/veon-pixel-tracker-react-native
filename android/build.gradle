apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "com.facebook.react"

android {
  namespace "com.veonpixeltrackerrn"
  compileSdk 36

  defaultConfig {
    minSdk 24
    targetSdk 36
  }

  publishing {
    singleVariant("release") {
      withSourcesJar()
      withJavadocJar()
    }
    singleVariant("debug") {
      withSourcesJar()
    }
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

repositories {
  google()
  mavenCentral()
  maven { url "https://jitpack.io" }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "com.github.veonadtech:pixel-tracker-android-sdk:0.2.1"
}
